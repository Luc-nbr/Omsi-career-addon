appId: nl.lucruigrok.omsicareer
productName: OMSI Career
copyright: Luc Ruigrok

directories:
  buildResources: build
  output: release

# node_modules wordt door electron-builder zelf meegenomen, maar alleen de
# productie-afhankelijkheden. Voor deze app is dat iconv-lite, nodig om de
# Windows-1252-bestanden van OMSI te lezen.
files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

# De plugin gaat mee als losse bestanden onder resources/plugin, zodat zowel het
# installatieprogramma als de app ze naar OMSI kan kopieren.
extraResources:
  - from: plugin/out/OMSICareerPlugin.dll
    to: plugin/OMSICareerPlugin.dll
  - from: plugin/OMSICareer.opl
    to: plugin/OMSICareer.opl

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName} ${version} Setup.${ext}

portable:
  artifactName: ${productName} ${version} draagbaar.${ext}

nsis:
  # Zet ook de overlay-plugin in de OMSI-map; zie build/installer.nsh.
  include: build/installer.nsh
  # Geen eenkliksinstallatie: de speler mag zien waar het heen gaat en kiezen.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMSI Career
  # Het logboek staat in AppData en hoort een herinstallatie te overleven.
  deleteAppDataOnUninstall: false
  # 1043 = Nederlands (Nederland)
  language: '1043'
