appId: nl.lucruigrok.omsienhancer
productName: OMSI Enhancer
copyright: Luc Ruigrok

directories:
  buildResources: build
  output: release

# node_modules wordt door electron-builder zelf meegenomen, maar alleen de
# productie-afhankelijkheden. Voor deze app is dat iconv-lite, nodig om de
# Windows-1252-bestanden van OMSI te lezen.
files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

# De plugin gaat mee als losse bestanden onder resources/plugin, zodat zowel het
# installatieprogramma als de app ze naar OMSI kan kopieren.
extraResources:
  - from: plugin/out/OMSICareerPlugin.dll
    to: plugin/OMSICareerPlugin.dll
  - from: plugin/OMSICareer.opl
    to: plugin/OMSICareer.opl
  # De Lua-plugin voor openOMSI; de app zet hem in OMSI 2\plugins\omsihub.
  - from: plugin/lua/omsihub/main.lua
    to: plugin/omsihub/main.lua
  # De licenties van onderdelen van anderen (MIT vraagt de tekst mee te leveren).
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Namen zonder spaties en zonder versienummer: GitHub maakt van een spatie in
  # een bijlage een punt, en dan klopt de naam in latest.yml niet meer met de
  # bijlage (de automatische updater vindt hem niet). Zonder versienummer blijft
  # ook de vaste downloadlink .../releases/latest/download/OMSI-Enhancer-Setup.exe
  # goed. Het versienummer staat in latest.yml, in de release en in de app.
  artifactName: OMSI-Enhancer-Setup.${ext}

# Waar de automatische updater kijkt (main/bijwerken.ts). Hierdoor schrijft
# electron-builder ook latest.yml en de blockmap; publiceren doet het niet
# vanzelf (dat gaat met scripts/publiceer.cjs, zie CLAUDE.md).
publish:
  provider: github
  owner: Luc-nbr
  repo: Omsi-career-addon

portable:
  artifactName: OMSI-Enhancer-draagbaar.${ext}

nsis:
  # Zet ook de overlay-plugin in de OMSI-map; zie build/installer.nsh.
  include: build/installer.nsh
  artifactName: OMSI-Enhancer-Setup.${ext}
  # Geen eenkliksinstallatie: de speler mag zien waar het heen gaat en kiezen.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OMSI Enhancer
  # Het logboek staat in AppData en hoort een herinstallatie te overleven.
  deleteAppDataOnUninstall: false
  # 1043 = Nederlands (Nederland)
  language: '1043'
