<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #34383d; }
    a { color: #2563EB; } a:hover { color: #1D4ED8; }
  </style>
</helmet>

<div style="width: 400px; height: 620px; background: #34383d; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; font-family: 'Space Grotesk', system-ui, sans-serif;">

  <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa1a8;">Over het spel</div>

  <div style="border: 3px solid #1E293B; box-shadow: 6px 6px 0 #1E293B; display: flex; flex-direction: column;">

    <div style="background: #2563EB; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 3px solid #1E293B;">
      <span style="font-weight: 700; font-size: 30px; line-height: 0.9; letter-spacing: -0.03em;">X49</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;">Route&nbsp;1</span>
      <span style="margin-left: auto; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 24px;">18:52</span>
    </div>

    <div style="background: #EA580C; color: #000000; display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-bottom: 3px solid #1E293B;">
      <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 28px; line-height: 1;">+2:14</span>
      <span style="font-weight: 700; font-size: 14px; text-transform: uppercase;">te laat</span>
      <span style="margin-left: auto; font-family: 'Space Mono', monospace; font-size: 12px;">RIT 1/2</span>
    </div>

    <div style="background: #F8FAFC; color: #1E293B; padding: 12px; border-bottom: 3px solid #1E293B;">
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;">Volgende halte</div>
      <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px;">
        <span style="flex-grow: 1; font-weight: 700; font-size: 25px; line-height: 1.02; letter-spacing: -0.025em;">HERRENHOF,<br>ST.-BERNHARD-WEG</span>
        <span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 22px;">18:53</span>
      </div>
    </div>

    <div style="background: #FFFFFF; color: #1E293B; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid #E2E8F0;">
        <span style="width: 10px; height: 10px; background: #2563EB;"></span>
        <span style="flex-grow: 1; font-size: 15px;">Herrenhof, am Anger</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 15px;">18:55</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid #E2E8F0;">
        <span style="width: 10px; height: 10px; background: #1E293B;"></span>
        <span style="flex-grow: 1; font-size: 15px;">Eliasroda</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 15px;">18:58</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid #E2E8F0;">
        <span style="width: 10px; height: 10px; background: #1E293B;"></span>
        <span style="flex-grow: 1; font-size: 15px;">Angelroda</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 15px;">19:00</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-family: 'Space Mono', monospace; font-size: 12px; color: #475569;">
        <span style="width: 10px;"></span>
        <span style="flex-grow: 1;">NOG 8 TOT HOHENKIRCHEN, BAHNHOF</span>
        <span>19:02</span>
      </div>
    </div>

    <div style="background: #1E293B; color: #F8FAFC; display: flex; gap: 0; border-top: 3px solid #1E293B;">
      <span style="flex-grow: 1; padding: 7px 12px; font-family: 'Space Mono', monospace; font-size: 13px;">28 KM/U</span>
      <span style="flex-grow: 1; padding: 7px 12px; font-family: 'Space Mono', monospace; font-size: 13px; border-left: 1px solid #475569;">14 AAN BOORD</span>
    </div>

  </div>

  <div style="border: 3px solid #1E293B; box-shadow: 6px 6px 0 #1E293B; flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
    <div style="background: #1E293B; color: #F8FAFC; display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;">
      Navigatie
      <span style="margin-left: auto; letter-spacing: 0;">25 M</span>
    </div>
    <div style="flex-grow: 1; background: #F8FAFC;">
      <svg width="100%" height="100%" viewBox="0 0 356 150" preserveAspectRatio="none">
        <path d="M-10 118 L120 104 L190 66 L230 10" stroke="#E2E8F0" stroke-width="24" fill="none" stroke-linejoin="round"/>
        <path d="M120 104 L300 92" stroke="#E2E8F0" stroke-width="17" fill="none"/>
        <path d="M-10 118 L120 104 L190 66 L230 10" stroke="#2563EB" stroke-width="6" fill="none" stroke-linejoin="round"/>
        <rect x="183" y="59" width="15" height="15" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/>
        <path d="M120 104 l-9 -13 l18 0 z" fill="#EA580C" stroke="#1E293B" stroke-width="2" transform="rotate(-6 120 104)"/>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
