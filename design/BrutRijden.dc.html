<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #F8FAFC; }
    a { color: #2563EB; } a:hover { color: #1D4ED8; }
  </style>
</helmet>

<div style="width: 880px; height: 560px; background: #F8FAFC; color: #1E293B; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 44px; border-bottom: 3px solid #1E293B; font-family: 'Space Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;">
    <span style="font-weight: 700;">OMSI ENHANCER</span>
    <span style="background: #1E293B; color: #F8FAFC; padding: 3px 8px; font-weight: 700;">DIENST LOOPT</span>
    <span style="margin-left: auto;">HOHENKIRCHEN &ndash; HERRENHOF / OMLOOP 08 / RIT 1 VAN 2</span>
  </div>

  <div style="display: flex; flex-grow: 1; min-height: 0;">

    <div style="width: 250px; border-right: 3px solid #1E293B; display: flex; flex-direction: column;">
      <div style="background: #2563EB; color: #FFFFFF; padding: 18px 20px 14px; border-bottom: 3px solid #1E293B;">
        <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Linie</div>
        <div style="font-weight: 700; font-size: 82px; line-height: 0.85; letter-spacing: -0.04em; margin-top: 4px;">X49</div>
      </div>
      <div style="padding: 14px 20px; border-bottom: 3px solid #1E293B;">
        <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Route</div>
        <div style="font-weight: 700; font-size: 42px; line-height: 1; margin-top: 2px;">1</div>
      </div>
      <div style="padding: 14px 20px; flex-grow: 1;">
        <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Vanaf halte</div>
        <div style="font-weight: 500; font-size: 18px; line-height: 1.22; margin-top: 5px;">Herrenhof,<br>am Anger</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

      <div style="display: flex; border-bottom: 3px solid #1E293B; min-height: 0;">
        <div style="flex-grow: 1; padding: 20px 22px; min-width: 0;">
          <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Richting</div>
          <div style="font-weight: 700; font-size: 44px; line-height: 0.98; letter-spacing: -0.035em; margin-top: 6px;">HOHEN&shy;KIRCHEN,<br>BAHNHOF</div>
        </div>
        <div style="width: 212px; background: #EA580C; color: #000000; border-left: 3px solid #1E293B; padding: 20px 20px 16px; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700;">Verschil</div>
          <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 52px; line-height: 0.9; letter-spacing: -0.03em; margin-top: 6px;">+2:14</div>
          <div style="font-weight: 700; font-size: 17px; margin-top: 4px; text-transform: uppercase;">Te laat</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 3px solid #1E293B;">
        <div style="padding: 13px 16px; border-right: 3px solid #1E293B;">
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;">Vertrek</div>
          <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; line-height: 1.1;">18:23</div>
        </div>
        <div style="padding: 13px 16px; border-right: 3px solid #1E293B;">
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;">Aankomst</div>
          <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; line-height: 1.1;">18:52</div>
        </div>
        <div style="padding: 13px 16px; border-right: 3px solid #1E293B;">
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;">Haltes</div>
          <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; line-height: 1.1;">18</div>
        </div>
        <div style="padding: 13px 16px;">
          <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;">Gereden</div>
          <div style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; line-height: 1.1;">12,4</div>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; align-items: center; gap: 12px; padding: 0 22px;">
        <button type="button" style="font: inherit; cursor: pointer; background: #2563EB; color: #FFFFFF; border: 3px solid #1E293B; box-shadow: 5px 5px 0 #1E293B; padding: 13px 20px; font-size: 16px; font-weight: 700; text-transform: uppercase;">Dienst afronden</button>
        <button type="button" style="font: inherit; cursor: pointer; background: #FFFFFF; color: #1E293B; border: 3px solid #1E293B; padding: 13px 16px; font-size: 15px; font-weight: 700;">Volledige dienst</button>
        <button type="button" style="font: inherit; cursor: pointer; background: #FFFFFF; color: #1E293B; border: 3px solid #1E293B; padding: 13px 16px; font-size: 15px; font-weight: 700;">Route</button>
        <button type="button" style="font: inherit; cursor: pointer; background: #FFFFFF; color: #1E293B; border: 3px solid #1E293B; padding: 13px 16px; font-size: 15px; font-weight: 700;">Overlay</button>
        <button type="button" style="font: inherit; cursor: pointer; background: transparent; color: #475569; border: none; padding: 13px 4px; font-family: 'Space Mono', monospace; font-size: 14px; text-decoration: underline; margin-left: auto;">annuleren</button>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
