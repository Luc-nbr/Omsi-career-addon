<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; background: #34383d; }
    a { color: #7ef0c0; } a:hover { color: #a9f7d8; }
  </style>
</helmet>

<div style="width: 400px; height: 620px; background: #34383d; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; font-family: 'Outfit', system-ui, sans-serif;">

  <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa1a8; font-weight: 300;">Over het spel</div>

  <div style="background: rgba(15, 17, 20, 0.92); color: #eef1f4; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 11px; padding: 16px 18px 12px;">
      <span style="border: 1px solid #7ef0c0; color: #7ef0c0; border-radius: 999px; padding: 3px 12px; font-size: 16px; font-weight: 500;">X49</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums;">18:52</span>
      <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 21px; font-weight: 500; color: #ffb27a; font-variant-numeric: tabular-nums;">+2:14</span>
    </div>

    <div style="padding: 0 18px 16px;">
      <div style="font-size: 11px; color: #79808a; font-weight: 300; letter-spacing: 0.06em;">Volgende halte</div>
      <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px;">
        <span style="flex-grow: 1; font-size: 26px; font-weight: 500; line-height: 1.12; letter-spacing: -0.01em;">Herrenhof, St.-Bernhard-Weg</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 6px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #7ef0c0; font-variant-numeric: tabular-nums;">18:53</span>
        <span style="font-size: 13px; color: #79808a; font-weight: 300;">&middot; over 340 m</span>
      </div>
    </div>

    <div style="padding: 0 18px 4px; display: flex; flex-direction: column;">

      <div style="display: flex; gap: 13px;">
        <div style="display: flex; flex-direction: column; align-items: center; width: 10px; padding-top: 6px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #4b535d;"></span>
          <span style="width: 1px; flex-grow: 1; background: #2a2f36; min-height: 16px;"></span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px;">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 300; color: #c9cfd6;">Herrenhof, am Anger</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #79808a; font-variant-numeric: tabular-nums;">18:55</span>
        </div>
      </div>

      <div style="display: flex; gap: 13px;">
        <div style="display: flex; flex-direction: column; align-items: center; width: 10px; padding-top: 6px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #4b535d;"></span>
          <span style="width: 1px; flex-grow: 1; background: #2a2f36; min-height: 16px;"></span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px;">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 300; color: #c9cfd6;">Eliasroda</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #79808a; font-variant-numeric: tabular-nums;">18:58</span>
        </div>
      </div>

      <div style="display: flex; gap: 13px;">
        <div style="display: flex; flex-direction: column; align-items: center; width: 10px; padding-top: 6px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #4b535d;"></span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 10px;">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 300; color: #c9cfd6;">Angelroda</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #79808a; font-variant-numeric: tabular-nums;">19:00</span>
        </div>
      </div>

      <div style="padding: 12px 0 14px 23px; font-size: 13px; color: #79808a; font-weight: 300;">nog 8 tot Hohenkirchen, Bahnhof &middot; 19:02</div>
    </div>

    <div style="display: flex; gap: 20px; padding: 12px 18px; border-top: 1px solid #1d2126; font-size: 12px; color: #79808a; font-weight: 300;">
      <span><b style="color: #eef1f4; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 400;">28</b> km/u</span>
      <span><b style="color: #eef1f4; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 400;">14</b> aan boord</span>
      <span style="margin-left: auto; color: #7ef0c0;">tevreden</span>
    </div>

  </div>

  <div style="background: rgba(15, 17, 20, 0.92); border-radius: 18px; overflow: hidden; flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 18px 10px; font-size: 11px; color: #79808a; font-weight: 300; letter-spacing: 0.06em;">
      Navigatie
      <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; color: #c9cfd6; letter-spacing: 0;">25 m</span>
    </div>
    <div style="flex-grow: 1; background: #14171b;">
      <svg width="100%" height="100%" viewBox="0 0 356 150" preserveAspectRatio="none">
        <path d="M-10 118 L120 104 L190 66 L230 10" stroke="#232830" stroke-width="24" fill="none" stroke-linejoin="round"/>
        <path d="M120 104 L300 92" stroke="#232830" stroke-width="17" fill="none"/>
        <path d="M-10 118 L120 104 L190 66 L230 10" stroke="#7ef0c0" stroke-width="4" fill="none" stroke-linejoin="round"/>
        <circle cx="190" cy="66" r="7" fill="#14171b" stroke="#7ef0c0" stroke-width="2.5"/>
        <path d="M120 104 l-8 -12 l16 0 z" fill="#ffffff" transform="rotate(-6 120 104)"/>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
