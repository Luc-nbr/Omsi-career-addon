<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #3c4650; }
    a { color: #ffffff; } a:hover { color: #d8e2ea; }
  </style>
</helmet>

<!--
  De achtergrond doet hier een stukje spel na: lucht, weg, berm. Dat moet wel,
  want het hele idee van deze richting is dat je er doorheen kijkt.
-->
<div style="width: 400px; height: 620px; position: relative; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden;">

  <svg width="400" height="620" viewBox="0 0 400 620" style="position: absolute; inset: 0;" preserveAspectRatio="none">
    <rect x="0" y="0" width="400" height="300" fill="#5a6b7d"/>
    <rect x="0" y="300" width="400" height="320" fill="#3f4a42"/>
    <path d="M120 300 L60 620 L330 620 L215 300 Z" fill="#4a4f52"/>
    <path d="M168 300 L150 620" stroke="#c9cdc4" stroke-width="5" stroke-dasharray="26 22" opacity="0.75"/>
    <rect x="18" y="330" width="58" height="120" fill="#46523f" opacity="0.85"/>
    <rect x="330" y="316" width="52" height="150" fill="#46523f" opacity="0.85"/>
  </svg>

  <div style="position: relative; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; height: 100%; box-sizing: border-box;">

    <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.72); text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Over het spel</div>

    <div style="background: rgba(22, 26, 32, 0.52); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; color: #ffffff; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,0.38);">

      <div style="display: flex; align-items: center; gap: 11px; padding: 15px 17px 12px;">
        <span style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 4px 11px; font-size: 16px; font-weight: 700;">X49</span>
        <span style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">18:52</span>
        <span style="margin-left: auto; background: rgba(255, 158, 100, 0.22); border: 1px solid rgba(255, 158, 100, 0.38); color: #ffc79e; border-radius: 10px; padding: 4px 10px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;">+2:14</span>
      </div>

      <div style="padding: 0 17px 14px;">
        <div style="font-size: 11px; color: rgba(255,255,255,0.66); letter-spacing: 0.04em;">Volgende halte</div>
        <div style="font-size: 25px; font-weight: 700; line-height: 1.12; margin-top: 3px; letter-spacing: -0.02em;">Herrenhof, St.-Bernhard-Weg</div>
        <div style="display: flex; align-items: baseline; gap: 9px; margin-top: 5px;">
          <span style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;">18:53</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.66);">&middot; over 340 m</span>
        </div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.14);"></div>

      <div style="padding: 11px 17px 13px; display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="flex-grow: 1; font-size: 15px; color: rgba(255,255,255,0.86);">Herrenhof, am Anger</span>
          <span style="font-size: 15px; color: rgba(255,255,255,0.66); font-variant-numeric: tabular-nums;">18:55</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="flex-grow: 1; font-size: 15px; color: rgba(255,255,255,0.86);">Eliasroda</span>
          <span style="font-size: 15px; color: rgba(255,255,255,0.66); font-variant-numeric: tabular-nums;">18:58</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="flex-grow: 1; font-size: 15px; color: rgba(255,255,255,0.86);">Angelroda</span>
          <span style="font-size: 15px; color: rgba(255,255,255,0.66); font-variant-numeric: tabular-nums;">19:00</span>
        </div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.6);">nog 8 tot Hohenkirchen, Bahnhof &middot; 19:02</div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.14);"></div>

      <div style="display: flex; gap: 18px; padding: 11px 17px; font-size: 13px; color: rgba(255,255,255,0.66);">
        <span><b style="color: #ffffff; font-size: 15px;">28</b> km/u</span>
        <span><b style="color: #ffffff; font-size: 15px;">14</b> aan boord</span>
        <span style="margin-left: auto; color: #8fe3b4;">tevreden</span>
      </div>

    </div>

    <div style="background: rgba(22, 26, 32, 0.52); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,0.38);">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 17px 9px; font-size: 11px; color: rgba(255,255,255,0.66); letter-spacing: 0.04em;">
        Navigatie
        <span style="margin-left: auto; color: #ffffff; font-weight: 600;">25 m</span>
      </div>
      <div style="flex-grow: 1; background: rgba(10, 13, 17, 0.42);">
        <svg width="100%" height="100%" viewBox="0 0 356 150" preserveAspectRatio="none">
          <path d="M-10 118 L120 104 L190 66 L230 10" stroke="rgba(255,255,255,0.16)" stroke-width="24" fill="none" stroke-linejoin="round"/>
          <path d="M120 104 L300 92" stroke="rgba(255,255,255,0.16)" stroke-width="17" fill="none"/>
          <path d="M-10 118 L120 104 L190 66 L230 10" stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round"/>
          <circle cx="190" cy="66" r="7" fill="rgba(10,13,17,0.6)" stroke="#ffffff" stroke-width="2.5"/>
          <path d="M120 104 l-8 -12 l16 0 z" fill="#ffc79e" transform="rotate(-6 120 104)"/>
        </svg>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
