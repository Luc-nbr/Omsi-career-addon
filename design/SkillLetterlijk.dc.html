<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;900&display=swap">
  <style>
    body { margin: 0; background: #0F172A; }
    a { color: #16A34A; } a:hover { color: #22C55E; }
  </style>
</helmet>

<div style="width: 880px; height: 560px; background: #0F172A; color: #F8FAFC; font-family: 'JetBrains Mono', monospace, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 22px; padding: 0 34px; height: 56px; font-size: 13px; color: #CBD5E1;">
    <span style="display: flex; align-items: center; gap: 8px; color: #16A34A;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A;"></span>
      Dienst loopt
    </span>
    <span>Hohenkirchen &ndash; Herrenhof</span>
    <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace;">rit 1 / 2</span>
  </div>

  <div style="padding: 0 34px; display: flex; gap: 16px; flex-grow: 1; min-height: 0;">

    <div style="flex-grow: 1; background: #111827; border-radius: 16px; padding: 28px 30px; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="border: 1px solid #16A34A; color: #16A34A; border-radius: 999px; padding: 5px 15px; font-size: 17px; font-weight: 700; font-family: 'Orbitron', sans-serif;">X49</span>
        <span style="color: #CBD5E1; font-size: 14px;">route 1</span>
      </div>

      <div style="margin-top: 26px; font-size: 13px; color: #CBD5E1;">Richting</div>
      <div style="margin-top: 5px; font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em;">Hohenkirchen,<br>Bahnhof</div>

      <div style="margin-top: auto; display: flex; gap: 40px;">
        <div>
          <div style="font-size: 12px; color: #CBD5E1;">Vertrek</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 400; margin-top: 3px; font-variant-numeric: tabular-nums;">18:23</div>
        </div>
        <div>
          <div style="font-size: 12px; color: #CBD5E1;">Aankomst</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 400; margin-top: 3px; color: #94A3B8; font-variant-numeric: tabular-nums;">18:52</div>
        </div>
        <div style="flex-grow: 1;">
          <div style="font-size: 12px; color: #CBD5E1;">Vanaf halte</div>
          <div style="font-size: 18px; font-weight: 500; margin-top: 6px;">Herrenhof, am Anger</div>
        </div>
      </div>
    </div>

    <div style="width: 286px; display: flex; flex-direction: column; gap: 16px;">

      <div style="background: #111827; border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; color: #CBD5E1;">Op de dienstregeling</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 46px; font-weight: 500; line-height: 1; color: #DC2626; font-variant-numeric: tabular-nums;">+2:14</span>
        <span style="font-size: 14px; color: #DC2626;">twee minuten te laat</span>
      </div>

      <div style="background: #111827; border-radius: 16px; padding: 20px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px;">12,4</div>
          <div style="font-size: 11px; color: #CBD5E1;">km gereden</div>
        </div>
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px;">18</div>
          <div style="font-size: 11px; color: #CBD5E1;">haltes</div>
        </div>
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px;">29</div>
          <div style="font-size: 11px; color: #CBD5E1;">minuten</div>
        </div>
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px;">08</div>
          <div style="font-size: 11px; color: #CBD5E1;">omloop</div>
        </div>
      </div>

    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 34px 22px;">
    <button type="button" style="font: inherit; cursor: pointer; border: none; background: #16A34A; color: #0F172A; padding: 13px 24px; border-radius: 999px; font-size: 15px; font-weight: 600;">Dienst afronden</button>
    <button type="button" style="font: inherit; cursor: pointer; border: 1px solid #334155; background: transparent; color: #F8FAFC; padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 500;">Volledige dienst</button>
    <button type="button" style="font: inherit; cursor: pointer; border: 1px solid #334155; background: transparent; color: #F8FAFC; padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 500;">Route</button>
    <button type="button" style="font: inherit; cursor: pointer; border: 1px solid #334155; background: transparent; color: #94A3B8; padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 500;">Overlay</button>
    <button type="button" style="font: inherit; cursor: pointer; border: none; background: transparent; color: #CBD5E1; padding: 13px 8px; font-size: 15px; font-weight: 400; margin-left: auto;">Annuleren</button>
  </div>

</div>
</x-dc>
</body>
</html>
