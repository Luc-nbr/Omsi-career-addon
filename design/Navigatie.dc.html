<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #3c4650; }
    a { color: #ffd23f; } a:hover { color: #ffe07a; }
  </style>
</helmet>

<div style="width: 420px; height: 620px; position: relative; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden;">

  <!-- Een stukje spel eronder, zodat te zien is dat het paneel erover ligt. -->
  <svg width="420" height="620" viewBox="0 0 420 620" style="position: absolute; inset: 0;" preserveAspectRatio="none">
    <rect x="0" y="0" width="420" height="300" fill="#5a6b7d"/>
    <rect x="0" y="300" width="420" height="320" fill="#3f4a42"/>
    <path d="M128 300 L64 620 L348 620 L226 300 Z" fill="#4a4f52"/>
    <path d="M177 300 L158 620" stroke="#c9cdc4" stroke-width="5" stroke-dasharray="26 22" opacity="0.75"/>
  </svg>

  <div style="position: relative; padding: 22px 20px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">

    <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.72); text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Navigatie</div>

    <div style="background: rgba(16, 20, 26, 0.58); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid rgba(255,255,255,0.18); border-radius: 22px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.42); display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">

      <!-- De manoeuvre: wat je nu moet doen, en over hoeveel meter. -->
      <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px 12px; color: #ffffff;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <path d="M12 21V8"/>
          <path d="M12 8c0-2.8 2.2-5 5-5h2"/>
          <path d="M16 6l3-3-3-3" transform="translate(0 3)"/>
        </svg>
        <div style="min-width: 0;">
          <div style="font-size: 25px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">340 m</div>
          <div style="font-size: 14px; color: rgba(255,255,255,0.78); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Herrenhof, St.-Bernhard-Weg</div>
        </div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 17px; font-weight: 700; color: #ff5f57; font-variant-numeric: tabular-nums;">18:53</div>
          <div style="font-size: 11px; color: rgba(255,255,255,0.6);">halte 7 / 18</div>
        </div>
      </div>

      <!-- De kaart zelf. -->
      <div style="position: relative; flex-grow: 1; min-height: 0; background: #151a20;">
        <svg width="100%" height="100%" viewBox="0 0 388 360" preserveAspectRatio="xMidYMid slice">

          <rect x="0" y="0" width="388" height="360" fill="#151a20"/>
          <path d="M0 0 L128 0 L96 96 L0 128 Z" fill="#16324a"/>
          <rect x="250" y="236" width="150" height="140" rx="16" fill="#1b2b1f"/>
          <rect x="24" y="252" width="86" height="64" rx="8" fill="#1d222a"/>
          <rect x="132" y="24" width="74" height="58" rx="8" fill="#1d222a"/>

          <g stroke="#232a34" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M-20 214 L120 200 L206 128 L260 40 L280 -20" stroke-width="30"/>
            <path d="M120 200 L150 372" stroke-width="22"/>
            <path d="M206 128 L400 108" stroke-width="22"/>
            <path d="M40 60 L120 200" stroke-width="16"/>
            <path d="M246 236 L120 200" stroke-width="14"/>
          </g>
          <g stroke="#333c48" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M-20 214 L120 200 L206 128 L260 40 L280 -20" stroke-width="22"/>
            <path d="M120 200 L150 372" stroke-width="15"/>
            <path d="M206 128 L400 108" stroke-width="15"/>
            <path d="M40 60 L120 200" stroke-width="10"/>
            <path d="M246 236 L120 200" stroke-width="9"/>
          </g>

          <path d="M-20 214 L120 200 L206 128 L260 40 L280 -20" stroke="#8a6a12" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M-20 214 L120 200 L206 128 L260 40 L280 -20" stroke="#ffd23f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

          <g font-family="Manrope, sans-serif" font-size="10" fill="#8b95a3" font-weight="500">
            <text x="24" y="196">Bernhardweg</text>
            <text x="228" y="122">Angelrodaer Str.</text>
            <text x="156" y="300">Am Anger</text>
            <text x="286" y="300" fill="#4d6b52">Stadtpark</text>
            <text x="16" y="44" fill="#4a7292">Herrenteich</text>
          </g>

          <g>
            <circle cx="206" cy="128" r="9" fill="#151a20" stroke="#ffd23f" stroke-width="4"/>
            <circle cx="260" cy="40" r="6" fill="#151a20" stroke="#7c848f" stroke-width="3"/>
          </g>

          <g transform="translate(120 200) rotate(-8)">
            <circle r="17" fill="rgba(255,210,63,0.16)"/>
            <path d="M0 -13 L10 11 L0 5 L-10 11 Z" fill="#ffffff" stroke="#151a20" stroke-width="1.6" stroke-linejoin="round"/>
          </g>

        </svg>

        <!-- Schaal, zoals in de app: bij stapvoets staat hij op 25 meter. -->
        <div style="position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 7px; color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6);">
          <span style="display: block; width: 44px; height: 6px; border: 1px solid rgba(255,255,255,0.8); border-top: none;"></span>
          25 m
        </div>

        <div style="position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px;">
          <span style="width: 34px; height: 34px; border-radius: 11px; background: rgba(16,20,26,0.62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600;">+</span>
          <span style="width: 34px; height: 34px; border-radius: 11px; background: rgba(16,20,26,0.62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600;">&minus;</span>
          <span style="width: 34px; height: 34px; border-radius: 11px; background: rgba(16,20,26,0.62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </span>
        </div>
      </div>

      <!-- Wat er na deze halte komt. -->
      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.82); font-size: 13px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5);"></span>
        <span style="flex-grow: 1;">daarna Herrenhof, am Anger</span>
        <span style="font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.62);">18:55</span>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
