<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #f2f2f0; }
    a { color: #1f6feb; } a:hover { color: #175bc4; }
  </style>
</helmet>

<div style="width: 880px; height: 560px; background: #f2f2f0; color: #1a1c1f; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px;">
    <span style="font-weight: 700; font-size: 15px;">OMSI Enhancer</span>
    <span style="display: flex; align-items: center; gap: 7px; background: #e4e9e5; border-radius: 999px; padding: 5px 12px; font-size: 13px; color: #4a5056;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #1b9e5a;"></span>
      Dienst loopt
    </span>
    <span style="margin-left: auto; font-size: 13px; color: #6b7076;">Hohenkirchen &ndash; Herrenhof &nbsp;·&nbsp; rit 1 van 2</span>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0;">

    <div style="grid-column: span 2; grid-row: span 2; background: #ffffff; border-radius: 20px; padding: 24px 26px; display: flex; flex-direction: column;">
      <span style="font-size: 13px; color: #6b7076;">Richting</span>
      <span style="font-size: 36px; font-weight: 700; line-height: 1.08; letter-spacing: -0.03em; margin-top: 6px;">Hohenkirchen,<br>Bahnhof</span>
      <span style="font-size: 15px; color: #6b7076; margin-top: 10px;">vanaf Herrenhof, am Anger</span>
      <div style="margin-top: auto; display: flex; gap: 26px;">
        <div>
          <div style="font-size: 12px; color: #6b7076;">Vertrek</div>
          <div style="font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;">18:23</div>
        </div>
        <div>
          <div style="font-size: 12px; color: #6b7076;">Aankomst</div>
          <div style="font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: #6b7076;">18:52</div>
        </div>
      </div>
    </div>

    <div style="background: #1f6feb; color: #ffffff; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; justify-content: center;">
      <span style="font-size: 12px; opacity: 0.8;">Linie</span>
      <span style="font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -0.03em;">X49</span>
      <span style="font-size: 13px; opacity: 0.8; margin-top: 3px;">route 1</span>
    </div>

    <div style="background: #ffe2d6; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; justify-content: center;">
      <span style="font-size: 12px; color: #9a4726;">Verschil</span>
      <span style="font-size: 38px; font-weight: 700; line-height: 1; color: #b4451f; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;">+2:14</span>
      <span style="font-size: 13px; color: #9a4726; margin-top: 2px;">te laat</span>
    </div>

    <div style="grid-column: span 2; background: #ffffff; border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 26px;">
      <div>
        <div style="font-size: 12px; color: #6b7076;">Gereden</div>
        <div style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;">12,4 km</div>
      </div>
      <div>
        <div style="font-size: 12px; color: #6b7076;">Haltes</div>
        <div style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;">6 / 18</div>
      </div>
      <div>
        <div style="font-size: 12px; color: #6b7076;">Aan boord</div>
        <div style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;">14</div>
      </div>
    </div>

    <div style="grid-column: span 2; background: #ffffff; border-radius: 20px; padding: 16px 22px; display: flex; flex-direction: column; justify-content: center; gap: 7px;">
      <span style="font-size: 12px; color: #6b7076;">Volgende halte</span>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="flex-grow: 1; font-size: 19px; font-weight: 600; line-height: 1.2;">Herrenhof, St.-Bernhard-Weg</span>
        <span style="font-size: 19px; font-weight: 700; color: #b4451f; font-variant-numeric: tabular-nums;">18:53</span>
      </div>
    </div>

    <div style="grid-column: span 2; background: #ffffff; border-radius: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 9px;">
      <button type="button" style="font: inherit; cursor: pointer; border: none; background: #1a1c1f; color: #ffffff; padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 600;">Dienst afronden</button>
      <button type="button" style="font: inherit; cursor: pointer; border: none; background: #eef0ee; color: #1a1c1f; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;">Dienst</button>
      <button type="button" style="font: inherit; cursor: pointer; border: none; background: #eef0ee; color: #1a1c1f; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;">Route</button>
      <button type="button" style="font: inherit; cursor: pointer; border: none; background: transparent; color: #6b7076; padding: 11px 6px; font-size: 14px; font-weight: 500; margin-left: auto;">Annuleren</button>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
